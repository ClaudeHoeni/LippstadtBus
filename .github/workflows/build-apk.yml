name: Build Oeffi Finder APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oeffi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Check existing signing key
        run: test -s app/oeffi-release.jks
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test, lint and build APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Copy APK to ABFAHRTEN.apk
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_FILE" ./ABFAHRTEN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ABFAHRTEN
          path: ABFAHRTEN.apk
      - name: Update stable release tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git tag -f v-latest "$GITHUB_SHA"
          git push origin refs/tags/v-latest --force
      - name: Publish tested auto-update release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-latest
          name: Aktuelle Version (${{ github.run_number }})
          body: "Umgebungssuche, Haltestellenauswahl, Zeitangaben und Wecker korrigiert. Automatischer Build Nr. ${{ github.run_number }}."
          files: ABFAHRTEN.apk
          fail_on_unmatched_files: true
