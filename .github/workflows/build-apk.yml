name: Build MamaFon APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Keystore dekodieren
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.jks
          else
            keytool -genkeypair -v -keystore app/release.jks -alias mamafon -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=MamaFon,O=Chris,C=DE"
          fi

      - name: Release APK bauen
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'android123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mamafon' }}
          KEY_PASS: ${{ secrets.KEY_PASS || 'android123' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MamaFon-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: GitHub Release aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MamaFon Latest Build (${{ github.run_number }})
          body: "Automatischer Build #${{ github.run_number }} aus Commit ${{ github.sha }}"
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true